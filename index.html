<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carwash Vahid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- افکت موج کارتونی -->
    <div class="cartoon-wave" id="cartoonWave">
        <svg class="wave-svg" viewBox="0 0 1440 400" preserveAspectRatio="none">
            <!-- لایه اول موج (تیره‌تر) -->
            <path class="wave-path wave-1" d="M0,200 Q180,100 360,200 T720,200 T1080,200 T1440,200 L1440,400 L0,400 Z" fill="#1e90ff"></path>
            <!-- لایه دوم موج (روشن‌تر) -->
            <path class="wave-path wave-2" d="M0,220 Q180,120 360,220 T720,220 T1080,220 T1440,220 L1440,400 L0,400 Z" fill="#4da6ff"></path>
            <!-- لایه سوم موج (روشن‌ترین) -->
            <path class="wave-path wave-3" d="M0,240 Q180,140 360,240 T720,240 T1080,240 T1440,240 L1440,400 L0,400 Z" fill="#80c1ff"></path>
            <!-- کف سفید روی موج -->
            <path class="wave-foam" d="M0,200 Q180,100 360,200 T720,200 T1080,200 T1440,200" fill="none" stroke="white" stroke-width="4" opacity="0.7"></path>
        </svg>
    </div>

    <!-- محتوای اصلی سایت -->
    <div class="fullscreen-bg" id="mainContent">
        <img src="images/logo.jpg" alt="Carwash Vahid" class="bg-image">
        
        <div class="buttons-container">
            <a href="https://instagram.com/YOUR_INSTAGRAM_ID" target="_blank" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
            <a href="https://maps.google.com/?q=YOUR_LOCATION" target="_blank" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // بعد از ۲ ثانیه، موج محو میشه
        window.addEventListener('load', function() {
            setTimeout(function() {
                const cartoonWave = document.getElementById('cartoonWave');
                cartoonWave.style.opacity = '0';
                cartoonWave.style.transition = 'opacity 0.5s ease';
                setTimeout(function() {
                    cartoonWave.style.display = 'none';
                }, 500);
            }, 2000);
        });
    </script>
</body>
</html>
